version: '3.8'

services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: scaffold_valkey_dev
    ports:
      - "6379:6379"
    command: valkey-server --appendonly yes

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.dev
    container_name: scaffold_api_dev
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NODE_ENV=development
      - VALKEY_URL=redis://valkey:6379
      - JWT_SECRET=super_secret_jwt_key_dev
    depends_on:
      - valkey

  postgres:
    image: postgres:16-alpine
    container_name: scaffold_postgres_dev
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=egobot
      - POSTGRES_PASSWORD=egobot
      - POSTGRES_DB=egobot
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile.dev
    container_name: scaffold_worker_dev
    # Identifiants LLM (LOGISTICS_MODEL_PROVIDER, AZURE_OPENAI_*, OPENAI_API_KEY...)
    # lus depuis ce fichier local non versionné plutôt qu'écrits ici en dur.
    env_file:
      - packages/logistics-agent/.env
    environment:
      - NODE_ENV=development
      - VALKEY_URL=redis://valkey:6379
      - REDIS_URL=redis://valkey:6379
      # packages/logistics-agent utilise désormais SQLite (voir son README) ;
      # le fichier .db, seedé sur l'hôte, est copié dans l'image par
      # Dockerfile.dev (COPY . .) — chemin absolu pour éviter toute ambiguïté
      # de résolution relative selon le CWD du process worker.
      - DATABASE_URL=file:/app/packages/logistics-agent/logistics.db
    depends_on:
      - valkey

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    container_name: scaffold_web_dev
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_dev_data:
