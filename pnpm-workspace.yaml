packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  prisma: true
  vue-demi: true

# Correctifs de securite sur des dependances transitives.
#
# Aucune de ces bibliotheques n'est declaree directement par le projet : elles
# arrivent via express, express-rate-limit, prisma et vitest. Les mises a jour
# des dependances directes ne suffisent pas — express est deja en 5.2.1, sa
# derniere version publiee, et embarque toujours un qs vulnerable.
#
# La syntaxe "paquet@plage" ne remplace que les versions concernees et laisse
# les autres intactes : indispensable pour brace-expansion, dont les lignes 2.x
# et 4.x/5.x sont toutes deux touchees mais ne se remplacent pas entre elles.
#
# A reevaluer a chaque montee de version des dependances directes : un override
# devenu inutile doit etre retire, sinon il fige silencieusement une version.
overrides:
  # Runtime (embarque dans l'image de l'API)
  "qs@<6.16.0": ">=6.16.0" # GHSA-4mjr-xmp4-gh2g — DoS via isBuffer
  "ip-address@<10.3.1": ">=10.3.1" # via express-rate-limit
  # Outillage Prisma
  "mysql2@<3.23.1": ">=3.23.1" # GHSA-rgwj-5xj2-c3m3 — bombe de decompression
  "fast-uri@<3.1.6": ">=3.1.6"
  "find-my-way@<9.6.1": ">=9.6.1"
  "valibot@<1.4.2": ">=1.4.2"
  "deepmerge-ts@<8.0.0": ">=8.0.0"
  # Runtime web : mermaid embarque sa propre copie de dompurify, non couverte
  # par la montee de la dependance directe de apps/web.
  "dompurify@<3.4.13": ">=3.4.13" # XSS via retrait de hook IN_PLACE
  # Chaine Vitest / Vite (developpement uniquement)
  "nanoid@<3.3.18": ">=3.3.18"
  "postcss@<8.5.23": ">=8.5.23"
  "brace-expansion@>=2.0.0 <2.1.4": ">=2.1.4"
  "brace-expansion@>=4.0.0 <5.0.9": ">=5.0.9"
  # Vite 6 arrive uniquement par vitest. La plage est volontairement bornee a
  # la ligne 6.x : apps/web depend directement de vite 5.4, qu'un override
  # global ferait basculer en 6 — un changement majeur cassant.
  # Borne haute indispensable : sans "<7", pnpm resout vers la derniere vite
  # publiee (8.x), que vitest 3.2 ne supporte pas.
  "vite@>=6.0.0 <6.4.3": ">=6.4.3 <7"
