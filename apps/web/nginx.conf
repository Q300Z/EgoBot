server {
    listen 80;
    server_name localhost;

    # Le front émet des requêtes relatives (apps/web/src/stores/auth.ts) : coder
    # l'adresse de l'API en dur ne fonctionne que si le navigateur tourne sur la
    # même machine qu'elle. Nginx joue donc ici le rôle que tient le proxy Vite
    # en développement (apps/web/vite.config.ts) — sans ces règles, /api/... est
    # capté par le bloc `location /` ci-dessous et renvoie index.html au lieu du
    # JSON attendu.
    #
    # `api` est le nom du service dans docker-compose.prod.yml, résolu par le
    # DNS interne de Docker.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Flux SSE : la mise en tampon doit être désactivée, sinon nginx accumule
    # les fragments et les délivre en bloc — l'affichage au fil de l'eau
    # disparaît. Le délai de lecture est allongé car la connexion reste
    # volontairement ouverte sans trafic entre deux fragments.
    location /sse/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding off;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
