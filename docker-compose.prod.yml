version: '3.8'

services:
  valkey:
    image: valkey/valkey:8-alpine
    container_name: scaffold_valkey_prod
    ports:
      - "6379:6379"
    command: valkey-server --appendonly yes
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: always

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.prod
    container_name: scaffold_api_prod
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - NODE_ENV=production
      - VALKEY_URL=redis://valkey:6379
      - SECRET_KEY=${SECRET_KEY:-${JWT_SECRET}}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      valkey:
        condition: service_healthy
    restart: always

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile.prod
    container_name: scaffold_worker_prod
    environment:
      - NODE_ENV=production
      - VALKEY_URL=redis://valkey:6379
      - REDIS_URL=redis://valkey:6379
    depends_on:
      - valkey
    restart: always

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.prod
    container_name: scaffold_web_prod
    ports:
      - "80:80"
    depends_on:
      - api
    restart: always
